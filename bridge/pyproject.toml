[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-codex-bridge"
version = "0.2.0"
description = "Local stdio bridge for Zotero PDF translation through Codex"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
dependencies = ["BabelDOC==0.6.4", "bitstring>=4.3,<5", "pymupdf>=1.26.7,<2", "opencv-python-headless>=4.10,<5", "peewee>=3.17.8,<4"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.scripts]
zotero-codex-bridge = "zotero_codex_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zotero_codex_bridge = ["assets.json"]
